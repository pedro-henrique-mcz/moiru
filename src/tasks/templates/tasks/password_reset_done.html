{% load static %}
<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Verifique seu E-mail | Sistema de Chamados</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/auth.css' %}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <style>
        body {
            background-image: url("{% static 'img/bg-login.png' %}");
            background-size: cover;
            background-position: center;
        }
        .text-welcome-green { color: #1e5146; }
    </style>
  </head>
  <body class="bg-light">
    <div class="container d-flex justify-content-center align-items-center min-vh-100">
        <div class="card p-4 card-custom shadow-lg border-0" style="max-width: 500px; width: 100%;">
           <div class="card-body text-center">
               <div class="mb-4"><i class="bi bi-envelope-check text-primary" style="font-size: 4rem;"></i></div>
               <h2 class="fw-bold text-welcome-green mb-3">Verifique seu E-mail</h2>
               <p class="text-muted px-3 mb-4">Enviamos instruções para o seu e-mail. Verifique a caixa de entrada ou spam.</p>
               <a href="{% url 'login' %}" class="btn btn-outline-primary w-100 py-2 fw-bold">Voltar para o Login</a>
            </div>
       </div>
    </div>
  </body>
</html>
