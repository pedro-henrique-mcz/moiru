{% load static %}
{% load crispy_forms_tags %}
<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Nova Senha | Sistema de Chamados</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/auth.css' %}">
    <style>
        body {
            background-image: url("{% static 'img/bg-login.png' %}");
            background-size: cover;
            background-position: center;
        }
        .text-welcome-green { color: #1e5146; }
    </style>
  </head>
  <body class="bg-light">
    <div class="container d-flex justify-content-center align-items-center min-vh-100">
        <div class="card p-4 card-custom shadow-lg border-0" style="max-width: 500px; width: 100%;">
           <div class="card-body">
               <div class="text-center mb-4 mt-2">
                   <h2 class="fw-bold text-welcome-green">Nova Senha</h2>
                   <p class="text-muted">Crie uma senha forte e segura.</p>
               </div>
               <form method="post">
                   {% csrf_token %}
                   {{ form|crispy }}
                   <button type="submit" class="btn btn-primary w-100 shadow-sm mt-4 py-2" style="font-weight: 600;">Alterar Senha</button>
               </form>
            </div>
       </div>
    </div>
  </body>
</html>
