{% load static %}
<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Senha Alterada | Sistema de Chamados</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/auth.css' %}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    
    <style>
        body {
            background-image: url("{% static 'img/bg-login.png' %}");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
        }
        .text-welcome-blue { 
            color: #13203B; 
        }
    </style>
  </head>
  <body class="bg-light">
    
    <div class="container d-flex justify-content-center align-items-center min-vh-100 px-3">
        <div class="card p-3 p-md-4 card-custom shadow-lg border-0 w-100" style="max-width: 400px; border-radius: 12px;">
           <div class="card-body text-center p-2">
               
               <div class="mb-3">
                   <i class="bi bi-check-circle-fill text-success" style="font-size: 3.5rem;"></i>
               </div>
               
               <h3 class="fw-bold text-welcome-blue mb-2 fs-4">Tudo Certo!</h3>
               <p class="text-muted mb-4" style="font-size: 0.9rem;">Sua senha foi alterada com sucesso.</p>
               
               <a href="{% url 'login' %}" class="btn btn-primary w-100 shadow-sm d-flex justify-content-center align-items-center" style="height: 45px; font-weight: 600; font-size: 1rem; border-radius: 8px;">
                   Fazer Login
               </a>
               
            </div>
       </div>
    </div>
    
  </body>
</html>
