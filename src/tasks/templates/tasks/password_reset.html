{% load static %}
<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Recuperar Senha | Sistema de Chamados</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/auth.css' %}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    
    <style>
        body {
            background-image: url("{% static 'img/bg-login.png' %}");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
        }
        .text-welcome-blue { color: #13203B; }
    </style>
  </head>
  <body class="bg-light">
    
    <div class="container d-flex justify-content-center align-items-center min-vh-100 px-3">
        <div class="card p-3 p-md-4 card-custom shadow-lg border-0 w-100" style="max-width: 400px; border-radius: 12px;">
           <div class="card-body p-2">
               
               <div class="text-center mb-4 mt-2">
                   <i class="bi bi-shield-lock text-primary mb-2 d-inline-block" style="font-size: 2.5rem;"></i>
                   <h3 class="fw-bold text-welcome-blue mb-2 fs-4">Esqueceu a senha?</h3>
                   <p class="text-muted" style="font-size: 0.85rem; line-height: 1.4;">
                       Digite seu e-mail cadastrado abaixo e enviaremos as instruções para redefinição.
                   </p>
               </div>

               <form method="post">
                   {% csrf_token %}
                   <div class="mb-4">
                       <label for="id_email" class="form-label text-muted mb-1 fw-bold" style="font-size: 0.75rem; text-transform: uppercase;">E-mail Cadastrado</label>
                       <input type="email" name="email" class="form-control bg-light" style="height: 45px; font-size: 0.95rem;" id="id_email" placeholder="exemplo@umj.edu.br" required>
                   </div>
                   
                   <div class="d-flex flex-column gap-3">
                       <button type="submit" class="btn btn-primary w-100 shadow-sm" style="height: 45px; font-weight: 600; font-size: 1rem; border-radius: 8px;">Enviar instruções</button>
                       <a href="{% url 'login' %}" class="btn btn-light w-100 border shadow-sm d-flex justify-content-center align-items-center text-muted" style="height: 45px; font-weight: 600; font-size: 1rem; border-radius: 8px; text-decoration: none;">Voltar para o Login</a>
                   </div>
               </form>
               
            </div>
       </div>
    </div>
    
  </body>
</html>
