{% load static %}
{% load crispy_forms_tags %}
<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login | Sistema de Chamados Administrativos</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/auth.css' %}">
    <style>
        body {
            background-image: url("{% static 'img/bg-login.png' %}");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
        }
        /* Nova cor azul que combina com a ilustração e mantém a pegada flat */
        .text-welcome-blue {
            color: #13203B; 
        }
    </style>
  </head>
  <body class="bg-light">

    <div class="container d-flex justify-content-center align-items-center min-vh-100 px-3">
        
        <div class="card p-3 p-md-4 card-custom shadow-lg border-0 w-100" style="max-width: 400px; border-radius: 12px;">
           <div class="card-body p-2">
                
               <div class="text-center mb-4 mt-2">
                   <h3 class="fw-bold text-welcome-blue mb-2 fs-4">Bem-vindo(a) de volta!</h3>
                   <p class="text-muted" style="font-size: 0.85rem; line-height: 1.4;">
                       Faça login para continuar acessando<br>seus chamados e serviços administrativos.
                   </p>
               </div>
               <form method="post">
                   {% csrf_token %} 
                   
                   <div class="mb-3">
                       <label for="user" class="form-label text-muted mb-1 fw-bold" style="font-size: 0.75rem; text-transform: uppercase;">Usuário</label>
                       <input type="text" name="username" class="form-control bg-light" style="height: 45px; font-size: 0.95rem;" id="user" placeholder="Seu usuário" required>
                   </div>

                   <div class="mb-3">
                       <label for="senha" class="form-label text-muted mb-1 fw-bold" style="font-size: 0.75rem; text-transform: uppercase;">Senha</label>
                       <input type="password" name="password" class="form-control bg-light" style="height: 45px; font-size: 0.95rem;" id="senha" placeholder="******" required>
                   </div>

                   <div class="d-flex flex-column flex-md-row justify-content-md-between align-items-start align-items-md-center gap-2 mb-4 mt-3">
                       <div class="form-check m-0 d-flex align-items-center gap-2">
                           <input class="form-check-input m-0 mt-0" type="checkbox" name="remember_me" id="rememberMe" style="cursor: pointer;">
                           <label class="form-check-label text-muted small m-0" for="rememberMe" style="cursor: pointer;">
                               Lembrar-me
                           </label>
                       </div>
                       
                       <a href="{% url 'password_reset' %}" class="small text-muted text-decoration-none fw-medium">Esqueceu a senha?</a>
                   </div>

                   <button type="submit" class="btn btn-primary w-100 shadow-sm mb-4" style="height: 45px; font-weight: 600; font-size: 1rem; border-radius: 8px;">Entrar</button>

                   <div class="text-center border-top pt-3">
                       <p class="text-muted mb-0" style="font-size: 0.8rem;">
                           Não está cadastrado? 
                           <a href="#" class="text-primary text-decoration-none fw-bold">Veja aqui como se cadastrar</a>
                       </p>
                   </div>

               </form> 
            </div>
       </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
