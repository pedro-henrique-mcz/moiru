{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Moiru - UMJ</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    
    <style>
        :root {
            --bg-body: #F5F5F5;
            --sidebar-bg: #FFFFFF;    
            --text-menu: #504D4D;
            --bg-menu-hover: #F2F2F2; 
            --bg-menu-active: #D9D9D9;
            --sidebar-width: 260px;
            --topbar-height: 70px;
        }

        body {
            background-color: var(--bg-body);
            font-family: 'Inter', sans-serif;
            color: var(--text-menu);
            overflow-x: hidden;
        }

        /* SIDEBAR */
        .sidebar {
            width: var(--sidebar-width);
            height: 100vh;
            background-color: var(--sidebar-bg);
            position: fixed;
            left: 0;
            top: 0;
            display: flex;
            flex-direction: column;
            padding: 30px 20px;
            border-right: 1px solid #E5E7EB;
            z-index: 1040; /* Z-index alto para ficar acima de tudo */
            transition: transform 0.3s ease-in-out; /* Animação de entrada/saída */
        }

        .nav-link-custom {
            display: flex; align-items: center; gap: 15px;
            color: var(--text-menu);
            padding: 12px 15px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 500;
            font-size: 1rem;
            transition: all 0.2s;
            margin-bottom: 8px;
        }
        .nav-link-custom i { font-size: 1.2rem; }
        .nav-link-custom:hover { background-color: var(--bg-menu-hover); color: #000; }
        .nav-link-custom.active { background-color: var(--bg-menu-active); color: #000; font-weight: 600; }

        /* LAYOUT PRINCIPAL */
        .main-content {
            margin-left: var(--sidebar-width);
            min-height: 100vh;
            display: flex; flex-direction: column;
            transition: margin-left 0.3s ease-in-out;
        }

        .top-bar {
            height: var(--topbar-height);
            background-color: #FFFFFF;
            border-bottom: 1px solid #E5E7EB;
            display: flex; align-items: center; justify-content: flex-end;
            padding: 0 40px;
        }

        .avatar-circle { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; }
        
        .content-area { 
            padding: 40px; 
            flex-grow: 1; 
        }
        
        /* Utilitário de Card */
        .card-clean {
            background: white; border: 1px solid #E5E7EB;
            border-radius: 8px; padding: 24px;
        }

        /* Fundo escuro ao abrir menu no celular */
        .sidebar-overlay {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background-color: rgba(0, 0, 0, 0.5);
            z-index: 1030;
            display: none;
            opacity: 0;
            transition: opacity 0.3s ease-in-out;
        }

        .sidebar-overlay.show {
            display: block;
            opacity: 1;
        }

        /* === REGRAS PARA CELULARES E TABLETS (Mobile) === */
        @media (max-width: 991.98px) {
            .sidebar {
                transform: translateX(-100%); /* Esconde o menu para a esquerda */
            }
            .sidebar.show {
                transform: translateX(0); /* Mostra o menu quando acionado */
            }
            .main-content {
                margin-left: 0; /* Tira o espaço vazio deixado pela sidebar */
            }
            .content-area {
                padding: 15px; /* Reduz o espaçamento gigante no celular */
            }
            .top-bar {
                padding: 0 15px; /* Ajusta a barra superior */
                justify-content: space-between; /* Espalha itens (Botão de menu na esquerda, avatar na direita) */
            }
        }
    </style>
</head>
<body>

    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    {% include 'partials/_sidebar.html' %}

    <div class="main-content">
        
        {% include 'partials/_header.html' %}

        <div class="content-area">
            {% if messages %}
                {% for message in messages %}
                    <div class="alert alert-{{ message.tags }} border-0 shadow-sm rounded-3 mb-4 d-flex align-items-center gap-2">
                        <i class="bi bi-info-circle-fill"></i> {{ message }}
                    </div>
                {% endfor %}
            {% endif %}

            {% block content %}{% endblock %}
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    <script>
        document.addEventListener("DOMContentLoaded", function() {
            const sidebar = document.querySelector('.sidebar');
            const overlay = document.getElementById('sidebarOverlay');
            
            // Função para alternar o menu
            window.toggleSidebar = function() {
                sidebar.classList.toggle('show');
                overlay.classList.toggle('show');
            };

            // Fecha o menu se o usuário clicar na área escura
            overlay.addEventListener('click', function() {
                sidebar.classList.remove('show');
                overlay.classList.remove('show');
            });
        });
    </script>
    {% block extra_js %}{% endblock %}
</body>
</html>
